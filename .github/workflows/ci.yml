name: CI

on: [push, pull_request]

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - run: uv pip install -e '.[geometry,dev]'
      - name: Lint
        run: uv run ruff check harness/
      - name: Fast tests
        run: uv run pytest harness/tests -q -m "not slow"
      - name: Accuracy tests (plan §1.3 targets)
        run: uv run pytest harness/tests -q -m slow

  # Plan §8: every pipeline change runs the ground-truth set. Fails the build if
  # wall-length error regresses by more than 0.5 percentage points.
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - run: uv pip install -e '.[geometry,dev]'
      - name: Render the ground-truth scenes
        run: uv run recon synth data/scenes --preset all --width 200 --height 150
             --stations 3 --max-keyframes 72 --vio-scale-error 1.025
      - name: Benchmark against the stored baseline
        run: uv run recon bench data/scenes --out runs/bench
             --baseline benchmarks/baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report
          path: runs/bench/

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo test --manifest-path core/Cargo.toml
      - run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path core/Cargo.toml -- --check

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The frame-conversion tests are plain JVM tests — no device, no emulator —
      # which is what makes the mirrored-scene guard (plan §7) run on every commit.
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: clients/android

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisory: model licences change upstream. Prints current state for
      # comparison against docs/licensing-audit.md.
      - run: bash scripts/check_licenses.sh
        continue-on-error: true
