name: CI

on: [push, pull_request]

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv --python 3.12
      - run: uv pip install -e '.[dev]'
      - name: Lint
        run: uv run ruff check harness/ scripts/capture/
      - name: Tests
        run: uv run pytest harness/tests -q

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo test --manifest-path core/Cargo.toml
      - run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - run: cargo fmt --manifest-path core/Cargo.toml -- --check

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The frame-conversion tests are plain JVM tests — no device, no emulator —
      # which is what makes the mirrored-scene guard run on every commit.
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: clients/android

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisory: model licences change upstream. Prints current state for
      # comparison against docs/licensing-audit.md.
      - run: bash scripts/check_licenses.sh
        continue-on-error: true
