[package]
name = "recon-core"
version = "0.1.0"
edition = "2021"
description = "Shared capture-guidance core for the room-to-house scanner (plan §3.8, §6.1)"
license = "Proprietary"

[lib]
# cdylib for the mobile targets, rlib so the desktop tests can link it directly.
crate-type = ["cdylib", "rlib"]
name = "recon_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# UniFFI is what makes ADR-0001's "shared core" real rather than aspirational.
# Until it landed, both clients hand-maintained their own copy of the keyframe
# rule, which is exactly the drift the shared core exists to prevent.
uniffi = { version = "0.28", features = ["cli"] }
thiserror = "1"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dev-dependencies]
approx = "0.5"

[profile.release]
lto = true
opt-level = 3
panic = "abort"
