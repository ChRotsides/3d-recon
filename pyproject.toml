[project]
name = "recon"
version = "0.1.0"
description = "Room-to-house 3D scanner — Phase-0 offline validation harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pillow>=10.3",
    "trimesh>=4.4",
]

[project.optional-dependencies]
# Heavy geometry stack. Kept optional so schema/guidance/eval tests run anywhere.
geometry = [
    "open3d>=0.18",
    "opencv-python-headless>=4.9",
]
# GPU-only. Do not install on the Kepler dev box; see docs/execution-status.md.
gpu = [
    "torch>=2.4",
    "torchvision>=0.19",
    "gsplat>=1.3",
]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
recon = "recon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness/recon"]

[tool.pytest.ini_options]
testpaths = ["harness/tests"]
pythonpath = ["harness", "server"]
# The slow tests render synthetic scenes — ~30 MB per run — and pytest keeps
# the last three runs' tmp dirs by default. Across a day of iterations that is
# hundreds of megabytes of rendered rooms nobody will look at again. Keep only
# what a failure needs for diagnosis.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
markers = [
    "gpu: requires a CUDA GPU with compute capability >= 7.0",
    "geometry: requires the optional Open3D/OpenCV stack",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = [
    "B008",
    # `str, Enum` rather than `StrEnum`: these types cross a wire and are read
    # by Swift and Kotlin clients. The mixin form is the pydantic idiom with the
    # most predictable JSON behaviour across versions; StrEnum buys nothing here.
    "UP042",
]
