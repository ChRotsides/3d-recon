[project]
name = "recon"
version = "0.1.0"
description = "Phone capture → 360 panorama + metric point cloud"
readme = "README.md"
requires-python = ">=3.11"
# The capture-to-cloud path only: read a bundle, run DA3, project by pose.
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pillow>=10.3",
    "opencv-python-headless>=4.9",
    # KD-tree for segment correspondence (recon/segments.py). Already present in
    # both ~/ai envs; declared so a fresh install is not missing it.
    "scipy>=1.11",
]

[project.optional-dependencies]
# Stock GPU wheels for modern cards. Kepler uses scripts/build-kepler-torch.sh
# instead, because these wheels no longer contain sm_35 kernels.
gpu = [
    "torch==2.13.0",
    "torchvision==0.28.0",
]
# Depth Anything 3. Source is pinned to an immutable git commit; model
# checkpoint revisions are deployment inputs and are required separately.
worker = [
    "depth-anything-3 @ git+https://github.com/ByteDance-Seed/Depth-Anything-3.git@3d835ec1a5802d64a8b8b15f817a1ab54809bfe4",
    "transformers==5.0.0",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["harness/recon"]

[tool.pytest.ini_options]
testpaths = ["harness/tests"]
pythonpath = ["harness"]
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
markers = [
    "gpu: requires a CUDA GPU with compute capability >= 7.0",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = [
    "B008",
    # `str, Enum` rather than `StrEnum`: these types cross a wire and are read
    # by Swift and Kotlin clients. The mixin form is the pydantic idiom with the
    # most predictable JSON behaviour across versions; StrEnum buys nothing here.
    "UP042",
]
