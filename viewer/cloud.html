<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Point cloud — DA3</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body { background: #08080a; color: #e6e6e6; overflow: hidden;
         font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
           display: block; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  .bar { position: fixed; left: 0; right: 0; top: 0; z-index: 2;
         display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
         padding: 10px 14px; background: linear-gradient(#000000cc, #00000000);
         pointer-events: none; }
  .bar strong { font-weight: 600; font-size: 14px; }
  .bar span { color: #9a9aa2; }
  .bar code { color: #8ab4ff; }

  .controls { position: fixed; bottom: 0; left: 0; right: 0; z-index: 2;
              display: flex; flex-direction: column; gap: 8px; align-items: center;
              padding: 12px max(12px, env(safe-area-inset-right))
                       max(12px, env(safe-area-inset-bottom))
                       max(12px, env(safe-area-inset-left));
              background: linear-gradient(#00000000, #000000d0); }
  .row { display: flex; gap: 10px; align-items: center; justify-content: center;
         flex-wrap: wrap; }
  .row .val { color: #8ab4ff; font-variant-numeric: tabular-nums;
              min-width: 62px; display: inline-block; }
  select { background: #1c1c22; color: #e6e6e6; border: 1px solid #33333d;
           border-radius: 7px; padding: 6px 8px; font: inherit; }
  button, a.btn { background: #1c1c22; color: #e6e6e6; border: 1px solid #33333d;
                  border-radius: 7px; padding: 8px 13px; font: inherit;
                  cursor: pointer; text-decoration: none; }
  button:hover, a.btn:hover { background: #26262e; }
  button.on { background: #2b4a7d; border-color: #3f6cb5; }
  .panel-toggle { display: none; }
  label { display: flex; gap: 7px; align-items: center; color: #9a9aa2; }
  input[type=range] { width: 130px; }
  /* Clears the three-row control panel; at 64px it sat across the slice row. */
  .hint { position: fixed; bottom: 152px; width: 100%; text-align: center;
          color: #7a7a83; z-index: 2; pointer-events: none;
          text-shadow: 0 1px 3px #000; }
  .mobile-hint { display: none; }

  @media (max-width: 720px), (pointer: coarse) {
    body { font-size: 14px; }
    .bar { align-items: center; gap: 4px 10px;
           padding: max(8px, env(safe-area-inset-top))
                    max(10px, env(safe-area-inset-right)) 12px
                    max(10px, env(safe-area-inset-left)); }
    .bar strong { font-size: 13px; }
    .bar span { width: 100%; overflow: hidden; text-overflow: ellipsis;
                white-space: nowrap; font-size: 11px; }
    .desktop-hint { display: none; }
    .mobile-hint { display: inline; }
    .hint { top: calc(max(8px, env(safe-area-inset-top)) + 49px); bottom: auto;
            padding: 0 10px; font-size: 12px; color: #a0a0aa; }
    .controls { max-height: min(58svh, 520px); overflow-y: auto;
                overscroll-behavior: contain; align-items: stretch; gap: 12px;
                padding-top: 8px; background: #0c0c10ee;
                border-top: 1px solid #33333d; border-radius: 16px 16px 0 0;
                transition: transform 160ms ease-out; }
    .controls.collapsed { left: auto; width: auto; max-height: none;
                          overflow: visible; padding: 0
                            max(10px, env(safe-area-inset-right))
                            max(10px, env(safe-area-inset-bottom)) 0;
                          background: transparent; border: 0; }
    .controls.collapsed .row { display: none; }
    .panel-toggle { display: block; align-self: center; min-height: 46px;
                    min-width: 116px; border-radius: 23px;
                    background: #202128ee; box-shadow: 0 3px 16px #0009; }
    .controls:not(.collapsed) .panel-toggle { position: sticky; top: 0;
                                              z-index: 1; }
    .row { display: grid; grid-template-columns: 1fr; gap: 10px;
           align-items: stretch; justify-items: stretch; }
    .row label { min-height: 44px; justify-content: space-between;
                 padding: 4px 2px; }
    .row button, .row a.btn, select { min-height: 44px; font-size: 16px; }
    input[type=range] { width: min(52vw, 250px); min-height: 40px; }
    .row .val { min-width: 68px; text-align: right; }
  }
</style>
</head>
<body>

<div class="bar">
  <strong>DA3 point cloud</strong>
  <span id="meta">loading…</span>
</div>

<canvas id="c"></canvas>

<div class="hint"><span class="desktop-hint">drag to orbit · scroll to zoom · shift-drag to pan · arrow keys sweep the slice · t texture · c clear cuts · r reset</span><span class="mobile-hint">one finger rotates · pinch zooms · two fingers pan · double-tap resets</span></div>
<div class="controls" id="controls">
  <button id="paneltoggle" class="panel-toggle" type="button" aria-expanded="true" aria-controls="controls">Hide controls</button>
  <div class="row">
    <button id="tex" class="on">Texture: on</button>
    <label>point <input id="size" type="range" min="1" max="60" step="1" value="10">
      <span class="val" id="sizeval">10 mm</span></label>
    <label>density <input id="keep" type="range" min="2" max="100" step="1" value="100">
      <span class="val" id="keepval">100%</span></label>
  </div>
  <div class="row">
    <label>slice
      <select id="axis">
        <option value="0">off</option>
        <option value="1">X</option>
        <option value="2">Y — plan</option>
        <option value="3">Z</option>
      </select></label>
    <label>at <input id="slicepos" type="range" min="0" max="1000" step="1" value="500">
      <span class="val" id="sliceposval">—</span></label>
    <label>thick <input id="slicethick" type="range" min="1" max="200" step="1" value="20">
      <span class="val" id="slicethickval">20 cm</span></label>
  </div>
  <div class="row">
    <label>ceiling <input id="ceil" type="range" min="0" max="1000" step="1" value="1000">
      <span class="val" id="ceilval">—</span></label>
    <label>far trim <input id="far" type="range" min="5" max="100" step="1" value="100">
      <span class="val" id="farval">off</span></label>
    <button id="clearcuts">Clear cuts</button>
    <button id="reset">Reset view</button>
    <a class="btn" href="/">← panoramas</a>
  </div>
</div>

<script>
// A point-cloud viewer with no dependencies.
//
// The cloud arrives as one flat buffer — float32 xyz then uint8 rgb — so it
// goes straight into GPU buffers with no parsing. At ~900k points that matters:
// a PLY text parse would cost more than the download.
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: true })
        || canvas.getContext('webgl', { antialias: true });
if (!gl) document.getElementById('meta').textContent = 'WebGL unavailable';

const VERT = `
attribute vec3 aPos;
attribute vec3 aCol;
uniform mat4 uMVP;
uniform float uRadius;   // point radius in metres
uniform float uFocalPx;  // pixels per radian-ish, from the projection
uniform float uTex;      // 1 = photographic colour, 0 = shaded by height
uniform float uYMin;
uniform float uYRange;
// Cuts. All of them hide points rather than change them, so nothing here can
// misrepresent the geometry — what is on screen is always a subset of the file.
uniform float uCeil;       // hide above this height
uniform float uMaxDist;    // hide beyond this distance from the cloud centre
uniform vec3  uCentre;
uniform float uSliceAxis;  // 0 off, 1 X, 2 Y, 3 Z
uniform float uSliceMin;
uniform float uSliceMax;
uniform float uKeep;       // fraction of points to draw, 0..1
varying vec3 vCol;
void main() {
  bool hide = aPos.y > uCeil || distance(aPos, uCentre) > uMaxDist;
  if (uSliceAxis > 0.5) {
    float v = uSliceAxis < 1.5 ? aPos.x : (uSliceAxis < 2.5 ? aPos.y : aPos.z);
    hide = hide || v < uSliceMin || v > uSliceMax;
  }
  if (uKeep < 0.999) {
    // Hash the position rather than the vertex index: it needs no extra
    // attribute buffer, works on WebGL 1, and — the part that matters when
    // judging density — it is stable, so the same points stay hidden as the
    // slider moves instead of the cloud reshuffling under you.
    float h = fract(sin(dot(aPos, vec3(12.9898, 78.233, 37.719))) * 43758.5453);
    hide = hide || h > uKeep;
  }
  if (hide) {
    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);   // outside the clip volume
    gl_PointSize = 0.0;
    vCol = vec3(0.0);
    return;
  }
  gl_Position = uMVP * vec4(aPos, 1.0);
  // A point is a disc of uRadius metres, projected properly: its pixel size
  // is radius * focal / depth. The previous form multiplied by an arbitrary
  // 300, which at a 12 m view made every point 60 pixels across — nearly a
  // million overlapping blobs, i.e. a solid wall of colour.
  gl_PointSize = clamp(uRadius * uFocalPx / max(gl_Position.w, 0.001), 1.0, 64.0);
  // Height ramp for the untextured view: geometry is far easier to read as
  // shape when colour is not competing with it.
  float h = clamp((aPos.y - uYMin) / max(uYRange, 0.001), 0.0, 1.0);
  vec3 shaded = mix(vec3(0.16, 0.24, 0.38), vec3(0.85, 0.90, 0.98), h);
  vCol = mix(shaded, aCol, uTex);
}`;

const FRAG = `
precision mediump float;
varying vec3 vCol;
void main() {
  // Round points; square ones alias into a grid pattern at these densities.
  vec2 d = gl_PointCoord - vec2(0.5);
  if (dot(d, d) > 0.25) discard;
  gl_FragColor = vec4(vCol, 1.0);
}`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
gl.useProgram(prog);

const uMVP = gl.getUniformLocation(prog, 'uMVP');
const uRadius = gl.getUniformLocation(prog, 'uRadius');
const uFocalPx = gl.getUniformLocation(prog, 'uFocalPx');
const uTex = gl.getUniformLocation(prog, 'uTex');
const uYMin = gl.getUniformLocation(prog, 'uYMin');
const uYRange = gl.getUniformLocation(prog, 'uYRange');
const uCeil = gl.getUniformLocation(prog, 'uCeil');
const uMaxDist = gl.getUniformLocation(prog, 'uMaxDist');
const uCentre = gl.getUniformLocation(prog, 'uCentre');
const uSliceAxis = gl.getUniformLocation(prog, 'uSliceAxis');
const uSliceMin = gl.getUniformLocation(prog, 'uSliceMin');
const uSliceMax = gl.getUniformLocation(prog, 'uSliceMax');
const uKeep = gl.getUniformLocation(prog, 'uKeep');

let count = 0, centre = [0, 0, 0], radius = 5;
let yaw = 0.6, pitch = 0.25, dist = 12;
let panX = 0, panY = 0;
let textured = true, pointRadiusM = 0.010;   // 1 cm discs
let units = 'm';
// Cut state, in metres. `bounds` is filled from the manifest at load.
let bounds = { min: [-1, -1, -1], max: [1, 1, 1] };
const cuts = { ceil: Infinity, maxDist: Infinity, axis: 0, slicePos: 0, sliceHalf: 0.10, keep: 1 };

// --- minimal matrix maths ------------------------------------------------
function perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  return [f / aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0];
}
function lookAt(eye, tgt, up) {
  const z = norm(sub(eye, tgt)), x = norm(cross(up, z)), y = cross(z, x);
  return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
          -dot(x,eye), -dot(y,eye), -dot(z,eye), 1];
}
const sub = (a,b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
function norm(v) { const l = Math.hypot(...v) || 1; return [v[0]/l, v[1]/l, v[2]/l]; }
function mul(a, b) {
  const o = new Array(16);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    o[i*4+j] = a[j]*b[i*4] + a[4+j]*b[i*4+1] + a[8+j]*b[i*4+2] + a[12+j]*b[i*4+3];
  }
  return o;
}

function draw() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(window.innerWidth * dpr), h = Math.round(window.innerHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.03, 0.03, 0.04, 1);
  gl.enable(gl.DEPTH_TEST);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  if (!count) return;

  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const eye = [
    centre[0] + panX + dist * cp * Math.sin(yaw),
    centre[1] + panY + dist * sp,
    centre[2] + dist * cp * Math.cos(yaw),
  ];
  const target = [centre[0] + panX, centre[1] + panY, centre[2]];
  const proj = perspective(Math.PI / 3, canvas.width / canvas.height, 0.05, radius * 60);
  gl.uniformMatrix4fv(uMVP, false, new Float32Array(mul(proj, lookAt(eye, target, [0,1,0]))));
  // Focal length in pixels for the current viewport, so a point keeps its
  // physical size whatever the window or the zoom does.
  const focalPx = canvas.height / (2.0 * Math.tan(Math.PI / 6));
  gl.uniform1f(uRadius, pointRadiusM);
  gl.uniform1f(uFocalPx, focalPx);
  gl.uniform1f(uTex, textured ? 1 : 0);
  // 1e9 rather than Infinity: a non-finite uniform is undefined behaviour and
  // silently blanks the cloud on some drivers.
  gl.uniform1f(uCeil, Number.isFinite(cuts.ceil) ? cuts.ceil : 1e9);
  gl.uniform1f(uMaxDist, Number.isFinite(cuts.maxDist) ? cuts.maxDist : 1e9);
  gl.uniform3f(uCentre, centre[0], centre[1], centre[2]);
  gl.uniform1f(uSliceAxis, cuts.axis);
  gl.uniform1f(uSliceMin, cuts.slicePos - cuts.sliceHalf);
  gl.uniform1f(uSliceMax, cuts.slicePos + cuts.sliceHalf);
  gl.uniform1f(uKeep, cuts.keep);
  gl.drawArrays(gl.POINTS, 0, count);
}

// The scene is static between interactions. Drawing only when something
// changes keeps an 800k-point cloud responsive without heating a phone or
// draining its battery while the user is simply inspecting the result.
let renderPending = false;
function requestDraw() {
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(() => { renderPending = false; draw(); });
}
window.addEventListener('resize', requestDraw);

// --- interaction ---------------------------------------------------------
// Pointer Events let the same controller handle mouse, pen, and true
// multitouch. One touch orbits; two touches zoom and pan simultaneously.
const pointers = new Map();
let dragging = false, panning = false, lastX = 0, lastY = 0;
let lastPinchDistance = 0, lastMidX = 0, lastMidY = 0;

function pointerMidpoint() {
  const pts = [...pointers.values()];
  return [(pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2];
}
function pointerDistance() {
  const pts = [...pointers.values()];
  return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
}
function clampDistance(value) {
  return Math.max(Math.max(radius * 0.04, 0.02), Math.min(radius * 20, value));
}
function beginGesture() {
  if (pointers.size >= 2) {
    [lastMidX, lastMidY] = pointerMidpoint();
    lastPinchDistance = Math.max(pointerDistance(), 1);
  } else if (pointers.size === 1) {
    const pt = pointers.values().next().value;
    lastX = pt.x; lastY = pt.y;
  }
}
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  dragging = true;
  panning = e.pointerType !== 'touch' && (e.button === 2 || e.shiftKey);
  beginGesture();
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size >= 2) {
    const [midX, midY] = pointerMidpoint();
    const pinchDistance = Math.max(pointerDistance(), 1);
    const dx = midX - lastMidX, dy = midY - lastMidY;
    dist = clampDistance(dist * lastPinchDistance / pinchDistance);
    panX -= dx * dist * 0.0016;
    panY += dy * dist * 0.0016;
    lastMidX = midX; lastMidY = midY; lastPinchDistance = pinchDistance;
    requestDraw();
    return;
  }
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (panning) {
    panX -= dx * dist * 0.0016;
    panY += dy * dist * 0.0016;
  } else {
    yaw -= dx * 0.006;
    // Stop just short of the poles, where the up vector degenerates.
    pitch = Math.max(-1.5, Math.min(1.5, pitch + dy * 0.006));
  }
  requestDraw();
});
for (const ev of ['pointerup', 'pointercancel']) {
  canvas.addEventListener(ev, e => {
    pointers.delete(e.pointerId);
    dragging = pointers.size > 0;
    beginGesture();
    canvas.classList.toggle('dragging', dragging);
  });
}
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  dist = clampDistance(dist * (e.deltaY < 0 ? 0.88 : 1.14));
  requestDraw();
}, { passive: false });
canvas.addEventListener('dblclick', e => { e.preventDefault(); resetView(); });

const controls = document.getElementById('controls');
const panelToggle = document.getElementById('paneltoggle');
const mobileLayout = window.matchMedia('(max-width: 720px), (pointer: coarse)');
function setPanelOpen(open) {
  controls.classList.toggle('collapsed', !open);
  panelToggle.textContent = open ? 'Hide controls' : 'Controls';
  panelToggle.setAttribute('aria-expanded', String(open));
}
function syncPanelLayout() {
  setPanelOpen(!mobileLayout.matches);
}
panelToggle.onclick = () => setPanelOpen(controls.classList.contains('collapsed'));
mobileLayout.addEventListener?.('change', syncPanelLayout);
syncPanelLayout();

const texBtn = document.getElementById('tex');
texBtn.onclick = () => {
  textured = !textured;
  texBtn.textContent = 'Texture: ' + (textured ? 'on' : 'off');
  texBtn.classList.toggle('on', textured);
};
document.getElementById('size').oninput = e => {
  const mm = parseFloat(e.target.value);
  pointRadiusM = mm / 1000.0;
  document.getElementById('sizeval').textContent = units === 'relative'
    ? pointRadiusM.toFixed(3) + ' rel.' : mm + ' mm';
};
function resetView() {
  yaw = 0.6; pitch = 0.25; dist = radius * 2.2; panX = 0; panY = 0;
  requestDraw();
}
document.getElementById('reset').onclick = resetView;

// --- cuts ----------------------------------------------------------------
const $ = id => document.getElementById(id);
const lerp = (a, b, t) => a + (b - a) * t;
//: Which world axis each slice option refers to; index 0 is "off".
const AXIS_OF = [null, 0, 1, 2];

function sliceRange() {
  const axis = AXIS_OF[cuts.axis];
  return axis === null ? [0, 1] : [bounds.min[axis], bounds.max[axis]];
}

function syncSlice() {
  const [lo, hi] = sliceRange();
  cuts.slicePos = lerp(lo, hi, $('slicepos').value / 1000);
  cuts.sliceHalf = parseFloat($('slicethick').value) / 200;   // cm, half-width
  $('sliceposval').textContent = cuts.axis
    ? cuts.slicePos.toFixed(2) + (units === 'relative' ? ' rel.' : ' m') : '—';
  $('slicethickval').textContent = units === 'relative'
    ? (2 * cuts.sliceHalf).toFixed(2) + ' rel.'
    : $('slicethick').value + ' cm';
}
function syncCeiling() {
  const t = $('ceil').value / 1000;
  cuts.ceil = t >= 1 ? Infinity : lerp(bounds.min[1], bounds.max[1], t);
  $('ceilval').textContent = t >= 1 ? 'off'
    : cuts.ceil.toFixed(2) + (units === 'relative' ? ' rel.' : ' m');
}
function syncFar() {
  const pct = parseFloat($('far').value);
  cuts.maxDist = pct >= 100 ? Infinity : radius * 2 * (pct / 100);
  $('farval').textContent = pct >= 100 ? 'off'
    : cuts.maxDist.toFixed(1) + (units === 'relative' ? ' rel.' : ' m');
}
function syncKeep() {
  cuts.keep = parseFloat($('keep').value) / 100;
  $('keepval').textContent = $('keep').value + '%';
}

$('axis').onchange = e => { cuts.axis = parseFloat(e.target.value); syncSlice(); };
$('slicepos').oninput = syncSlice;
$('slicethick').oninput = syncSlice;
$('ceil').oninput = syncCeiling;
$('far').oninput = syncFar;
$('keep').oninput = syncKeep;

function clearCuts() {
  $('axis').value = '0'; cuts.axis = 0;
  $('slicepos').value = 500;
  $('slicethick').value = 20;
  $('ceil').value = 1000;
  $('far').value = 100;
  $('keep').value = 100;
  syncSlice(); syncCeiling(); syncFar(); syncKeep();
  requestDraw();
}
$('clearcuts').onclick = clearCuts;

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 't' || e.key === 'T') texBtn.click();
  if (e.key === 'r' || e.key === 'R') resetView();
  if (e.key === 'c' || e.key === 'C') clearCuts();
  // Step the slice along its axis — the fastest way to sweep a room for
  // doubled surfaces is to hold an arrow key and watch the section move.
  if (cuts.axis && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    const step = e.key === 'ArrowLeft' ? -5 : 5;
    $('slicepos').value = Math.max(0, Math.min(1000, Number($('slicepos').value) + step));
    syncSlice();
    requestDraw();
    e.preventDefault();
  }
});

// --- load ----------------------------------------------------------------
(async () => {
  // A base supplied in the URL lets one viewer inspect several builds without
  // copying large binary files into this directory. The historical local
  // cloud.json/cloud.bin pair remains the default.
  const dataBase = new URLSearchParams(location.search).get('base') || 'cloud';
  const meta = await (await fetch(dataBase + '.json?t=' + Date.now())).json();
  const buf = await (await fetch(dataBase + '.bin?t=' + Date.now())).arrayBuffer();
  count = meta.count;
  units = meta.units || 'm';
  const pos = new Float32Array(buf, 0, count * 3);
  const col = new Uint8Array(buf, count * 12, count * 3);

  // Geometry keeps its exact bounds, including legitimate distant openings.
  // Robust view bounds only decide the initial camera framing, so one far cell
  // cannot make the room occupy a tiny patch in the middle of the screen.
  centre = meta.view_centre || meta.centre;
  radius = Math.max(...(meta.view_extent || meta.extent)) * 0.5;
  resetView();

  // Cut sliders span the robust bounds, not the exact ones: a single point out
  // through a doorway would otherwise push the whole useful range of every
  // slider into a few pixels at one end.
  bounds = { min: meta.view_min || meta.min, max: meta.view_max || meta.max };
  clearCuts();

  // Default the disc to the grid the points came from. A point smaller than
  // its own cell leaves a gap between every neighbour, so a complete surface
  // renders as a sieve and the fault looks like missing data. Slightly over
  // half the cell size: discs on a grid must overlap to tile it, and the
  // diagonal neighbour is the one that decides.
  if (meta.voxel_m) {
    const mm = Math.round(meta.voxel_m * 1000 * 0.75);
    const slider = document.getElementById('size');
    slider.max = Math.max(Number(slider.max), mm * 2);
    slider.value = mm;
    pointRadiusM = mm / 1000.0;
    document.getElementById('sizeval').textContent = mm + ' mm';
  }

  const pb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, pb);
  gl.bufferData(gl.ARRAY_BUFFER, pos, gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);

  const cb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, cb);
  gl.bufferData(gl.ARRAY_BUFFER, col, gl.STATIC_DRAW);
  const aCol = gl.getAttribLocation(prog, 'aCol');
  gl.enableVertexAttribArray(aCol);
  gl.vertexAttribPointer(aCol, 3, gl.UNSIGNED_BYTE, true, 0, 0);

  const shadeMin = meta.view_min || meta.min;
  const shadeMax = meta.view_max || meta.max;
  gl.uniform1f(uYMin, shadeMin[1]);
  gl.uniform1f(uYRange, shadeMax[1] - shadeMin[1]);

  document.getElementById('meta').innerHTML =
    `${count.toLocaleString()} points · ${meta.keyframes} keyframes · ` +
    `<code>${meta.model}</code> · extent ` +
    `<code>${meta.extent.map(v => v.toFixed(1)).join(' × ')} ` +
    `${units === 'relative' ? 'relative units' : 'm'}</code>`;
  requestDraw();
})();

// Slider/select/button changes bubble here after their individual handlers
// update the state, coalescing a burst of touch events into one frame.
controls.addEventListener('input', requestDraw);
controls.addEventListener('change', requestDraw);
controls.addEventListener('click', requestDraw);
</script>
</body>
</html>
