<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Property walkthrough</title>
<!--
  Walkthrough viewer (PLAN.md §1.1, §3.8).

  Runs inside the app's WebView rather than as two native splat renderers.
  Babylon.js 8+ reads SPZ natively, which is why §3.7 ships SPZ to clients.

  Babylon is LEFT-handed by default; everything upstream is right-handed, Y-up
  (plan §5). The scene manifest states its frame and the conversion required,
  and this viewer applies it — see applyFrame(). Skipping that step renders a
  mirrored house that looks entirely plausible, which is the §7 failure mode.

  Babylon is loaded from a local vendored copy so the WebView works offline;
  the app ships it in its assets. Falling back to a CDN would make a capture
  review depend on signal in someone's basement.
-->
<style>
  :root { color-scheme: dark light; --ink:#f5f7fa; --panel:#12161cd9; --line:#ffffff26; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#0b0e12;
               font-family: Inter, -apple-system, system-ui, sans-serif; color:var(--ink); }
  #view { width:100%; height:100%; display:block; touch-action:none; outline:none; }
  .panel { position:absolute; background:var(--panel); border:1px solid var(--line);
           border-radius:12px; backdrop-filter: blur(12px); padding:12px 14px; }
  #hud { top:12px; left:12px; font-size:13px; line-height:1.5; max-width:46vw; }
  #hud b { font-weight:600; }
  #plan { bottom:12px; left:12px; width:min(34vw,260px); padding:10px; }
  #plan svg { width:100%; height:auto; display:block; }
  #rooms { top:12px; right:12px; display:flex; flex-direction:column; gap:6px;
           max-height:70vh; overflow:auto; }
  #rooms button { background:#ffffff14; color:var(--ink); border:1px solid var(--line);
                  border-radius:8px; padding:7px 12px; font-size:12px; cursor:pointer;
                  text-align:left; }
  #rooms button:hover { background:#ffffff24; }
  #rooms button[aria-current="true"] { background:#2dd4bf29; border-color:#2dd4bf80; }
  #err { position:absolute; inset:auto 12px 12px 12px; color:#fca5a5; display:none; }
  @media (max-width: 640px) { #plan { display:none; } #hud { max-width:70vw; } }
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div id="hud" class="panel">loading…</div>
<div id="rooms" class="panel" hidden></div>
<div id="plan" class="panel" hidden><svg id="planSvg" viewBox="0 0 100 100"></svg></div>
<div id="err" class="panel"></div>

<script src="./vendor/babylon.js"></script>
<script src="./vendor/babylon.loaders.js"></script>
<script type="module" src="./walkthrough.js"></script>
</body>
</html>
